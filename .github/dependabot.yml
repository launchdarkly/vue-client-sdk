version: 2
updates:
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  # npm — example app only (directory with a lockfile)
  - package-ecosystem: 'npm'
    directory: '/example'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'
        - '@launchdarkly/*'
